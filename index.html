<!DOCTYPE html>
<html lang="en">
<head>

html{scroll-behavior:smooth}

body{

}

header{
  background:#fff;

  justify-content:space-between;
  position:sticky;
  top:0;
  z-index:1000;
  box-shadow:0 2px 15px #00000012;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
}

.logo-icon{
  font-size:40px;
}

.logo h1{
  font-size:22px;
  color:#087443;
}

.logo p{
  font-size:11px;
  color:#666;
}

nav a{
  text-decoration:none;
  color:#173b2c;
  margin:0 9px;

  font-size:14px;
}

.donate-top{
  background:#ff5a4f;
  color:white!important;
  padding:11px 18px;
  border-radius:25px;
}

.hero{

  padding:70px 7%;
  display:flex;
  align-items:center;
  color:white;
  background:
  linear-gradient(90deg,#064c35dd,#064c3566),
  url("https://images.unsplash.com/photo-1488521787991-ed7bbaae773c?auto=format&fit=crop&w=1800&q=85");
  background-size:cover;
  background-position:center;
}

.hero-content{
  max-width:650px;
}

.badge{
  display:inline-block;

  padding:7px 15px;
  border-radius:20px;
  margin-bottom:18px;
}

  font-size:48px;
  line-height:1.1;
  margin-bottom:12px;

.hero h3{
  color:#ffd35a;

  margin-bottom:15px;
}

.hero p{
  font-size:18px;
}

.btn{
  display:inline-block;
  margin-top:25px;
  padding:14px 28px;
  background:#0aaa69;
  color:white;
  border-radius:30px;
  text-decoration:none;
  font-weight:bold;
  border:0;
  cursor:pointer;
  font-size:16px;
}

section{
  max-width:1150px;
  margin:auto;
  padding:65px 20px;
}

.title{
  text-align:center;
  margin-bottom:35px;
}

.title h2{
  font-size:34px;
  color:#075e3a;
}

.title p{
  color:#666;
}
